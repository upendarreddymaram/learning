# AI Dev Orchestrator — local development stack
# Phase 1+: PostgreSQL, Redis
# Phase 7+: Kafka
# Phase 10+: Prometheus, Grafana, OTel collector
# Phase 13+: Flink (optional profile)

services:
  postgres:
    image: postgres:16-alpine
    container_name: orchestrator-postgres
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orchestrator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment in Phase 7 — Kafka event bus
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.5.0
